<!DOCTYPE html>
<!-- Define o tipo do documento como HTML5 -->
<html lang="pt-BR">
  <!-- Define o idioma da página como português do Brasil -->
  <head>
    <meta charset="UTF-8" />
    <!-- Suporte a acentuação e caracteres especiais -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Deixa o site responsivo -->

    <title>My Hero Task</title>
    <!-- Título da aba do navegador -->

    <link rel="stylesheet" href="style.css" />
    <!-- Importa o CSS externo -->
  </head>

  <body>
    <!-- Início do corpo visível da página -->

    <header>
      <!-- Cabeçalho principal da página -->
      <h1>My Hero Task</h1>
      <!-- Título principal -->
      <p>Organize suas tarefas como um herói 🦸‍♂️</p>
      <!-- Subtítulo descritivo -->
    </header>

    <main>
      <!-- Conteúdo principal da página -->

      <section class="cards">
        <!-- Área que contém os três cartões de tarefas -->

        <div class="card">
          <!-- Primeiro card: Frontend -->
          <h2>Frontend</h2>
          <!-- Título do card -->
          <ul>
            <!-- Lista de tarefas -->
            <li>✅ Montar layout</li>
            <!-- Tarefa concluída -->
            <li>🕑 Conectar API</li>
            <!-- Tarefa em andamento -->
            <li>🔜 Animações</li>
            <!-- Tarefa pendente -->
          </ul>
        </div>

        <div class="card">
          <!-- Segundo card: Backend -->
          <h2>Backend</h2>
          <ul>
            <li>✅ Criar rotas</li>
            <li>🕑 Validações</li>
            <li>🔜 Banco de dados</li>
          </ul>
        </div>

        <div class="card">
          <!-- Terceiro card: Design -->
          <h2>Design</h2>
          <ul>
            <li>✅ Wireframe</li>
            <li>🕑 Cores e fontes</li>
            <li>🔜 Logo</li>
          </ul>
        </div>
      </section>

      <section class="grafico">
        <!-- Área reservada para o futuro gráfico -->
        <h2>Gráfico de Progresso</h2>
        <div class="grafico-placeholder">[ Gráfico virá aqui ]</div>
        <!-- Placeholder temporário -->
      </section>
    </main>

    <script src="script.js"></script>
    <!-- Conecta o arquivo JS para interações -->
  </body>
</html>
